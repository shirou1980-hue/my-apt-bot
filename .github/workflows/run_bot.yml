name: 청약 일정 daily 이메일 알림

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  send-apt-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 청약 알림 실행
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }} # 🔥 드디어 출입증이 파이썬으로 전달됩니다!
        run: python apt_bot.py
