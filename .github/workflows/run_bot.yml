name: Applyhome Automation Bot

on:
  schedule:
    - cron: '30 23 * * *' # 매일 아침 한국시간 08:30 자동 가동
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 크롤러 전용 의존성 라이브러리 및 크롬 설치
      run: |
        pip install selenium beautifulsoup4

    - name: 청약 자동화 매크로 프로그램 가동
      env:
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python apt_bot.py
