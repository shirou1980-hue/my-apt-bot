name: Applyhome Automation Bot
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v4
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: API 진단 (임시)
      env:
        PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      run: |
        python3 - << 'EOF'
        import os, urllib.request, urllib.parse, json
        from datetime import datetime, timedelta

        RAW = os.environ.get("PUBLIC_DATA_API_KEY", "")
        print(f"키 존재: {'YES' if RAW else 'NO'}")
        print(f"키 길이: {len(RAW)}")
        print(f"키 끝4자: ...{RAW[-4:] if RAW else '없음'}")

        decoded = urllib.parse.unquote(RAW)
        KEY = urllib.parse.quote(decoded, safe='')

        today = datetime.now()
        FROM = (today - timedelta(days=30)).strftime("%Y%m%d")
        TO = (today + timedelta(days=30)).strftime("%Y%m%d")

        # 테스트 1: 날짜 파라미터 포함
        url1 = f"https://apis.data.go.kr/B551011/APTLttotPblancSvc/getAPTLttotPblancMstList?serviceKey={KEY}&numOfRows=5&pageNo=1&_type=json&pblancBgnde={FROM}&pblancEndde={TO}"
        # 테스트 2: 날짜 파라미터 없음
        url2 = f"https://apis.data.go.kr/B551011/APTLttotPblancSvc/getAPTLttotPblancMstList?serviceKey={KEY}&numOfRows=5&pageNo=1&_type=json"

        for label, url in [("날짜포함", url1), ("날짜없음", url2)]:
            print(f"\n=== {label} ===")
            try:
                req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                with urllib.request.urlopen(req, timeout=20) as r:
                    raw = r.read().decode("utf-8")
                if raw.strip().startswith("<"):
                    print(f"XML응답(키오류): {raw[:400]}")
                    continue
                d = json.loads(raw)
                h = d["response"]["header"]
                b = d["response"]["body"]
                print(f"resultCode={h['resultCode']} / {h['resultMsg']}")
                print(f"totalCount={b['totalCount']}")
                if b['totalCount'] > 0:
                    items = b["items"]["item"]
                    if isinstance(items, dict): items = [items]
                    print("첫번째 아이템 모든 필드:")
                    for k, v in sorted(items[0].items()):
                        print(f"  {k}: {v}")
            except Exception as e:
                print(f"오류: {e}")
        EOF
