name: Applyhome Automation Bot

on:
  schedule:
    - cron: '30 23 * * *' # 매일 아침 한국시간 08:30 자동 작동
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 🔥 현재 apt_bot.py가 쓰는 Selenium과 BeautifulSoup 라이브러리를 정확하게 설치합니다.
    # 가상 서버 환경에 크롬 브라우저 뼈대까지 완벽하게 주입합니다.
    - name: Selenium 및 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install selenium beautifulsoup4

    - name: 청약 자동화 매크로 프로그램 가동
      env:
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        # 노드 버전 잔소리를 차단하는 안전장치
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      run: python apt_bot.py
