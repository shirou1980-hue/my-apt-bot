name: 청약 일정 daily 이메일 알림

on:
  schedule:
    - cron: '30 22 * * *'   # 매일 한국시간 오전 7시 30분 (UTC 22:30 전날)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

jobs:
  send-apt-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # 혹시 무한 루프 방지

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright-v1

      - name: Playwright 설치
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 청약 알림 실행
        env:
          GMAIL_ADDRESS:  ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PW:   ${{ secrets.GMAIL_APP_PW }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python apt_alert.py
