name: Applyhome Automation Bot

on:
  schedule:
    - cron: '30 23 * * *' # 매일 아침 한국시간 08:30 자동 가동
  workflow_dispatch: # 수동 가동 버튼

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 🔥 브라우저를 전혀 안 쓰므로 아름답고 깔끔하게 딱 beautifulsoup4 하나만 설치합니다.
    - name: 필수 경량 파서 라이브러리 설치
      run: |
        pip install beautifulsoup4

    - name: 청약 자동화 프로그램 가동
      env:
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python apt_bot.py
